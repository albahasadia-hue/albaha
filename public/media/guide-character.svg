<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="المرشد السياحي الذكي لمنطقة الباحة" fill="none">
  <defs>
    <radialGradient id="gc-bg-grad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#13457A"/>
      <stop offset="68%" stop-color="#0A2E5C"/>
      <stop offset="100%" stop-color="#061A33"/>
    </radialGradient>
    <linearGradient id="gc-gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C986"/>
      <stop offset="55%" stop-color="#C89D54"/>
      <stop offset="100%" stop-color="#9A7231"/>
    </linearGradient>
    <linearGradient id="gc-skin-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAC096"/>
      <stop offset="100%" stop-color="#D49F72"/>
    </linearGradient>
    <clipPath id="gc-circle-clip">
      <circle cx="48" cy="48" r="42"/>
    </clipPath>
  </defs>

  <!-- Outer sovereign sapphire badge + gold trim -->
  <circle cx="48" cy="48" r="45.5" fill="url(#gc-bg-grad)" stroke="url(#gc-gold-grad)" stroke-width="2.4"/>
  <circle cx="48" cy="48" r="42" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>

  <g clip-path="url(#gc-circle-clip)">
    <!-- Subtle Al-Baha mountain silhouette background -->
    <path d="M4 68 L22 50 L36 60 L54 44 L70 57 L92 48 L92 92 L4 92 Z" fill="#006C35" opacity="0.24"/>
    <path d="M4 75 Q26 63 48 70 T92 67 L92 92 L4 92 Z" fill="#061A33" opacity="0.48"/>

    <!-- Shoulders & crisp cream Saudi thobe + formal dark sapphire heritage waistcoat -->
    <path d="M18 93 C19 73 30 65 48 65 C66 65 77 73 78 93 Z" fill="#FAF7F0"/>
    <path d="M18 93 C19 74 28 67 41 66 L48 83 L55 66 C68 67 77 74 78 93 Z" fill="#0A2E5C"/>
    <!-- Thobe collar & front placket -->
    <path d="M40 65 L48 74 L56 65" fill="#FCFBF7" stroke="#E2DAC8" stroke-width="1"/>
    <path d="M48 74 L48 91" stroke="#C89D54" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Al-Baha stepped heritage trim on bisht/vest lapel -->
    <path d="M35 70 L39 74 L35 78 L39 82" stroke="#C89D54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M61 70 L57 74 L61 78 L57 82" stroke="#C89D54" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Emerald hospitality pin -->
    <circle cx="62" cy="77" r="3" fill="#006C35" stroke="#E7C986" stroke-width="1"/>

    <!-- Neck -->
    <path d="M42 58 L42 68 Q48 71 54 68 L54 58 Z" fill="#CFA073"/>

    <!-- Back drape of cream-and-gold edged Saudi Ghutra / Shemagh -->
    <path d="M27 42 C24 58 23 73 27 83 C32 82 35 75 37 64 Z" fill="#FCFBF7"/>
    <path d="M69 42 C72 58 73 73 69 83 C64 82 61 75 59 64 Z" fill="#F2ECE0"/>
    <!-- Subtle traditional Al-Baha pattern accents on drape -->
    <path d="M27 72 L31 74 M69 72 L65 74" stroke="#9B2C2C" stroke-width="1.2" opacity="0.55" stroke-linecap="round"/>

    <!-- Face -->
    <path d="M35 42 C35 33 40 28 48 28 C56 28 61 33 61 42 C61 52 55.5 61 48 61 C40.5 61 35 52 35 42 Z" fill="url(#gc-skin-grad)"/>
    <!-- Ears -->
    <path d="M34.5 42 C32.5 42 32.5 48 35 48.5" fill="#D8A77A"/>
    <path d="M61.5 42 C63.5 42 63.5 48 61 48.5" fill="#D8A77A"/>

    <!-- Eyebrows, warm eyes, nose -->
    <path d="M38.5 39.5 Q41.5 37.5 44.8 39" stroke="#1E293B" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M51.2 39 Q54.5 37.5 57.5 39.5" stroke="#1E293B" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="42" cy="43" r="1.8" fill="#061A33"/>
    <circle cx="54" cy="43" r="1.8" fill="#061A33"/>
    <circle cx="42.6" cy="42.4" r="0.6" fill="#FFFFFF"/>
    <circle cx="54.6" cy="42.4" r="0.6" fill="#FFFFFF"/>
    <path d="M48 42.5 L47 48.5 Q48.5 49.5 50 48.5" stroke="#B77E52" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Groomed beard & friendly smile -->
    <path d="M35.4 48 C36.2 57.5 41.5 62 48 62 C54.5 62 59.8 57.5 60.6 48 C58.8 52.5 54 55 48 55 C42 55 37.2 52.5 35.4 48 Z" fill="#1F2937" opacity="0.92"/>
    <path d="M42.5 51.5 Q48 50 53.5 51.5" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M44 53.5 Q48 56.5 52 53.5" stroke="#FCFBF7" stroke-width="1.7" stroke-linecap="round"/>

    <!-- Crisp Ghutra headdress fold & black-and-gold Igal -->
    <path d="M27 42 C27 25 35 17 48 17 C61 17 69 25 69 42 C66 35 59 31 48 31 C37 31 30 35 27 42 Z" fill="#FCFBF7"/>
    <path d="M31 28 C37 22 59 22 65 28" stroke="#D8CEBC" stroke-width="1.1"/>
    <!-- Black & gold Igal crown rings -->
    <rect x="33.5" y="19.5" width="29" height="4.8" rx="2.4" fill="#111827" stroke="#C89D54" stroke-width="1"/>
    <rect x="35" y="23.5" width="26" height="3.2" rx="1.6" fill="#1F2937" stroke="#C89D54" stroke-width="0.7"/>
  </g>
</svg>
